name: Daily initiative monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email instead of dry-running"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: daily-initiative-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern run hour
        id: time
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=America/New_York date +%H)" != "08" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.time.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        if: steps.time.outputs.run == 'true'
        run: uv sync --frozen

      - name: Run monitor
        if: steps.time.outputs.run == 'true'
        env:
          REDDIT_USER_AGENT: agentsenate/0.1 (contact: matyasbeyene@gmail.com)
          STORAGE_BACKEND: supabase
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.send_email }}" == "true" ]]; then
            uv run agentsenate
          else
            uv run agentsenate --dry-run
          fi

      - uses: actions/upload-artifact@v4
        if: steps.time.outputs.run == 'true'
        with:
          name: digest-preview
          path: digest-preview.html
          if-no-files-found: ignore
