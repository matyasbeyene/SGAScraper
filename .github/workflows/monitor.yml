name: Daily initiative monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      send_email:
        description: "Send email instead of dry-running"
        required: false
        default: "false"
      send_initial_digest:
        description: "Include the first collection in the digest (requires send_email)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-initiative-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select Eastern morning schedule
        id: time
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          expected="0 13 * * *"
          if [[ "$(TZ=America/New_York date +%z)" == "-0400" ]]; then
            expected="0 12 * * *"
          fi
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" != "$expected" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.time.outputs.run == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.time.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        if: steps.time.outputs.run == 'true'
        run: uv sync --frozen

      - name: Run monitor
        if: steps.time.outputs.run == 'true'
        env:
          REDDIT_USER_AGENT: "agentsenate/0.1 (contact: matyasbeyene@gmail.com)"
          STORAGE_BACKEND: supabase
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AGENTSENATE_CONFIG: ${{ github.event_name == 'push' && 'config/smoke.yaml' || 'config/schools.yaml' }}
          SEND_INITIAL_DIGEST: ${{ inputs.send_initial_digest }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            uv run agentsenate --dry-run
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.send_email }}" != "true" ]]; then
            uv run agentsenate --dry-run
          else
            args=()
            if [[ "$SEND_INITIAL_DIGEST" == "true" ]]; then
              args+=(--send-initial-digest)
            fi
            uv run agentsenate "${args[@]}"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.time.outputs.run == 'true'
        with:
          name: digest-preview
          path: digest-preview.html
          if-no-files-found: ignore
