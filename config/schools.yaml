# The sender must be a verified Resend address.
email:
  recipients:
    - bradywilliams2029@gmail.com
  # Address on your Resend receiving domain, e.g. research@inbound.example.org.
  reply_to: ""
  # Defaults to recipients when empty.
  authorized_reply_senders: []
  max_topics: 8
  minimum_actionability_score: 3
  maximum_attachment_bytes: 5000000
  maximum_total_attachment_bytes: 10000000

sources:
  reddit:
    enabled: true
    include_top_level_comments: false
    min_request_interval_seconds: 61
    lookback_days: 30
    feeds: [new, top_month]
    max_pages: 2
  usg_board:
    enabled: true
    archive_url: https://www.usg.edu/regents/meetings/date/{year}/
    min_request_interval_seconds: 0.5
    document_kinds: [agenda, minutes, notice, committee]
  newsletters:
    enabled: true
    min_request_interval_seconds: 1
    max_articles_per_feed: 25
    fetch_article_body: true
  yikyak:
    enabled: false
    provider: null
