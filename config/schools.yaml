sources:
  reddit:
    enabled: true
    rss_only: true
    include_top_level_comments: false
    min_request_interval_seconds: 61
    lookback_days: 7
    feeds: [new]
    max_pages: 1
  usg_board:
    enabled: false
    archive_url: https://www.usg.edu/regents/meetings/date/{year}/
    min_request_interval_seconds: 0.5
    document_kinds: [agenda, minutes, notice, committee]
  newsletters:
    enabled: true
    min_request_interval_seconds: 0.5
    max_articles_per_feed: 3
    fetch_article_body: false
  yikyak:
    enabled: false
    provider: null
